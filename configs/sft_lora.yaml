# SFT com LoRA no Qwen2.5-Coder-1.5B-Instruct, num T4 de 16 GB (Kaggle/Colab gratuito).
#
# VRAM estimada (medir e registrar em summary.json -> vram_pico_gb):
#   pesos fp16 ~3,1 GB + adapter/Adam fp32 ~0,3 GB + ativações com checkpointing ~1 GB
#   + logits (2 x 1024 x 151.936 vocab; a loss sobe para fp32) ~2-3 GB  =>  ~7-9 GB.
# O vocabulário de 152k faz dos logits o maior consumidor de ativação: por isso batch 2 x accum 8.
name: sft-lora
method: lora
seed: 42
out_dir: runs/sft-lora

model:
  base_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
  dtype: float16            # T4 (Turing) não tem bf16 nativo
  attn_implementation: sdpa # flash-attn exige Ampere+

lora:
  r: 16                     # ~18,5M parâmetros treináveis (~1,2% do modelo) com todos os lineares
  alpha: 32                 # alpha/r = 2, a escala usual
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  learning_rate: 2.0e-4     # LoRA tolera LR ~10x maior que SFT completo
  num_epochs: 3             # dataset pequeno (milhares de exemplos): 2-3 épocas; acompanhar a loss de validação
  batch_size: 2
  grad_accum: 8             # batch efetivo 16
  max_length: 1024          # cobre código + pergunta + resposta da maioria dos exemplos; medir o p95 do dataset
  warmup: 0.03
  scheduler: cosine
  precision: fp16
  activation_checkpointing: true
  optim: adamw_torch
  logging_steps: 10
  save_steps: 200
  eval_fraction: 0.05

data:
  train_path: data/sft.jsonl
  eval_dataset_dirs: [../forja-evals/datasets/forja-seed-v0]
