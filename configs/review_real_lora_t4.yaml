# Experimentos D1–D3 do forja-dados na T4 do Kaggle: o mesmo SFT LoRA do review_lora_cpu.yaml
# (seed, LoRA, lr, épocas, lote 1 × 8), mudando só o dado. Os três rodam na mesma GPU e precisão,
# então a comparação entre eles muda uma variável só (o sintético da CPU fp32 fica como referência à parte).
# D1 = sintético, D2 = real (review-real-v0), D3 = misto (sintético + real, concatenados no notebook).
name: review-real-lora-t4
method: lora
seed: 42
out_dir: runs/review-real-lora-t4

model:
  base_id: Qwen/Qwen2.5-Coder-0.5B-Instruct
  dtype: float32            # pesos mestres fp32 + AMP fp16: o 0.5B cabe folgado nos 16 GB da T4
  attn_implementation: sdpa # T4 (Turing) não tem flash-attn nem bf16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  learning_rate: 2.0e-4
  num_epochs: 2
  batch_size: 1             # igual à CPU: sem padding, a única diferença para o review_lora_cpu é a precisão
  grad_accum: 8
  max_length: 2048   # dado real: mediana 1.318 tokens, p99 1.713, máx 2.207 (1 exemplo cortado)
  warmup: 0.05
  scheduler: cosine
  precision: fp16
  activation_checkpointing: false
  optim: adamw_torch
  logging_steps: 5
  save_steps: 50
  eval_fraction: 0.05

data:
  train_path: data/review-real-v0/sft.jsonl
  eval_dataset_dirs: [../forja-evals/datasets/forja-seed-v0]
