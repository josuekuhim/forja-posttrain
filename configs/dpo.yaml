# DPO com LoRA sobre o checkpoint SFT já mesclado (saída do `forja-posttrain merge`).
# A referência é o próprio modelo com o adapter desligado: não há segunda cópia do modelo na GPU.
#
# VRAM estimada no T4: política fp16 ~3,1 GB + adapter ~0,3 GB + forward de chosen e rejected
#   (batch 2 => 4 sequências) com checkpointing e logits de 152k ~4-5 GB + forward da referência
#   sem gradiente ~1 GB  =>  ~9-11 GB.
name: dpo
method: dpo
seed: 42
out_dir: runs/dpo

model:
  base_id: Qwen/Qwen2.5-Coder-1.5B-Instruct  # registrado no summary; a política vem de dpo.policy_path
  dtype: float16
  attn_implementation: sdpa

dpo:
  policy_path: runs/sft-lora/merged   # SFT antes do DPO: DPO direto no base aprende mal o formato
  beta: 0.1                 # força do vínculo com a referência; maior = mais conservador
  loss_type: sigmoid        # DPO original
  use_lora: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  learning_rate: 5.0e-6     # DPO é sensível: LR alto faz a política colapsar (recompensas sobem, texto piora)
  num_epochs: 1
  batch_size: 2
  grad_accum: 8
  max_length: 1024
  warmup: 0.1
  scheduler: cosine
  precision: fp16
  activation_checkpointing: true
  optim: adamw_torch
  logging_steps: 10
  save_steps: 200
  eval_fraction: 0.05

data:
  preference_dir: data/preferencias
  eval_dataset_dirs: [../forja-evals/datasets/forja-seed-v0]
